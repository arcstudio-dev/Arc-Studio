<!DOCTYPE html>
<html lang="de" class="lang-de">
<head>
<meta charset="UTF-8">
<script>if(localStorage.getItem('arc_theme')==='dark')document.documentElement.classList.add('dm');</script>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<meta name="theme-color" content="#08080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KI-Tutor">
<link rel="manifest" href="pwa/manifest.json">
<title>KI-Tutor · Arc Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
:root{
  --bg:#ffffff;--bg2:#f8f5ff;--bg3:#f3f0fa;--bg4:#ede8f8;
  --ac:#a855f7;--acd:#9333ea;--acg:rgba(168,85,247,.12);--acb:rgba(168,85,247,.2);
  --tx:#1a1a2e;--tx2:#6b7280;--tx3:#9ca3af;
  --sep:rgba(122,14,200,.06);--br:rgba(0,0,0,.07);
  --ok:#30d158;--warn:#ff9f0a;--err:#ff453a;
  --r:12px;--sa:'Inter',system-ui,sans-serif;--mo:'JetBrains Mono',monospace;
}
.dm{
  color-scheme:dark;
  --bg:#0a0a0f;--bg2:#0f0f17;--bg3:#171720;--bg4:#1e1e2a;
  --tx:#f0f0f5;--tx2:#a0a0b0;--tx3:#606070;
  --sep:rgba(255,255,255,.06);--br:rgba(255,255,255,.09);
}
body{font-family:var(--sa);background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}

/* ── HEADER ── */
.hdr{position:sticky;top:0;z-index:50;background:rgba(8,8,15,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--sep);height:56px;display:flex;align-items:center;padding:0 1rem;gap:.75rem;flex-shrink:0;}
.dm .hdr{background:rgba(10,10,15,.92);}
.hdr-logo{display:flex;align-items:center;gap:.5rem;flex:1;}
.hdr-icon{width:34px;height:34px;background:var(--acg);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;border:1px solid var(--acb);}
.hdr-title{font-size:15px;font-weight:700;letter-spacing:-.2px;color:#fff;}
.hdr-sub{font-size:11px;color:rgba(255,255,255,.4);font-family:var(--mo);}
.hdr-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:rgba(255,255,255,.7);font-size:16px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;flex-shrink:0;}
.hdr-btn:active{opacity:.6;transform:scale(.95);}

/* ── WEAK PANEL ── */
.weak-panel{padding:.75rem 1rem;background:var(--bg2);border-bottom:1px solid var(--sep);display:none;}
.weak-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin-bottom:.4rem;}
.weak-topics{display:flex;flex-wrap:wrap;gap:.35rem;}
.weak-chip{padding:.25rem .6rem;border-radius:20px;border:1px solid rgba(255,69,58,.3);background:rgba(255,69,58,.08);color:var(--err);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;}
.weak-chip:hover{background:rgba(255,69,58,.15);}
.weak-chip.med{border-color:rgba(255,159,10,.3);background:rgba(255,159,10,.08);color:var(--warn);}

/* ── CHAT ── */
.chat-wrap{flex:1;overflow-y:auto;padding:.75rem 1rem 6rem;display:flex;flex-direction:column;gap:.75rem;}
.msg{max-width:88%;padding:.75rem 1rem;border-radius:16px;font-size:14px;line-height:1.6;word-break:break-word;animation:fadeUp .2s ease;}
.msg.user{align-self:flex-end;background:var(--ac);color:#fff;border-radius:16px 16px 4px 16px;}
.msg.ai{align-self:flex-start;background:var(--bg2);color:var(--tx);border:1px solid var(--sep);border-radius:16px 16px 16px 4px;}
.dm .msg.ai{background:var(--bg3);}
.msg strong{font-weight:700;}
.msg code{font-family:var(--mo);background:rgba(0,0,0,.08);padding:1px 5px;border-radius:4px;font-size:13px;}
.dm .msg code{background:rgba(255,255,255,.08);}
.msg.thinking{color:var(--tx3);font-style:italic;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ── QUICK CHIPS ── */
#quick-area{padding:.5rem 0;}
.quick-label{font-size:11px;font-weight:600;color:var(--tx3);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.06em;}
.quick-chips{display:flex;flex-wrap:wrap;gap:.4rem;}
.chip{padding:.4rem .8rem;border-radius:20px;border:1px solid var(--sep);background:var(--bg2);color:var(--tx2);font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;}
.chip:active{opacity:.6;}

/* ── INPUT BAR ── */
.input-bar{position:fixed;bottom:0;left:0;right:0;padding:.75rem 1rem;background:var(--bg);border-top:1px solid var(--sep);display:flex;gap:.5rem;z-index:40;}
.dm .input-bar{background:var(--bg2);}
.ki-input{flex:1;background:var(--bg2);border:1px solid var(--br);border-radius:var(--r);padding:.6rem .9rem;font-size:15px;color:var(--tx);font-family:var(--sa);outline:none;transition:border-color .2s;}
.ki-input:focus{border-color:var(--ac);}
.dm .ki-input{background:var(--bg3);border-color:rgba(255,255,255,.1);}
.ki-send{background:var(--ac);color:#fff;border:none;border-radius:var(--r);padding:.6rem 1rem;font-size:16px;cursor:pointer;font-weight:700;transition:opacity .2s;flex-shrink:0;}
.ki-send:active{opacity:.7;}

/* ── APP BADGE ── */
.app-badge{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .6rem;border-radius:99px;font-size:11px;font-weight:700;border:1px solid;margin-bottom:.5rem;}

/* ── SCROLL ANCHOR ── */
.scroll-anchor{height:1px;}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-logo">
    <div class="hdr-icon" id="hdr-icon">🤖</div>
    <div>
      <div class="hdr-title" id="hdr-title">KI-Tutor</div>
      <div class="hdr-sub" id="hdr-sub">offline · IHK-fokussiert</div>
    </div>
  </div>
  <button class="hdr-btn" onclick="resetChat()" title="Neu starten">🔄</button>
  <button class="hdr-btn" id="back-btn" onclick="kiTutorGoBack()" title="Zurück">←</button>
</header>

<!-- Schwächen-Panel -->
<div class="weak-panel" id="weak-panel">
  <div class="weak-label">⚠️ Deine schwächsten Themen</div>
  <div class="weak-topics" id="weak-topics"></div>
</div>

<!-- Chat -->
<div class="chat-wrap" id="chat-wrap">
  <div id="quick-area">
    <div class="quick-label">Schnellfragen</div>
    <div class="quick-chips" id="quick-chips"></div>
  </div>
  <div id="chat-msgs"></div>
  <div class="scroll-anchor" id="scroll-anchor"></div>
</div>

<div class="input-bar">
  <input class="ki-input" type="text" id="ki-input" placeholder="Stell eine Frage..." autocomplete="off">
  <button class="ki-send" onclick="kiSend()">→</button>
</div>

<script>

// APP CONFIG
// ════════════════════════════════════════════════════════════════
var params = new URLSearchParams(location.search);
var APP_ID = (params.get('app') || 'ampere').toLowerCase();

var APP_CONFIG = {
  ampere: {
    label: 'AMPERE',
    icon: '🔶',
    color: '#f97316',
    beruf: 'Elektroniker für Betriebstechnik',
    perfKey: 'amp_topic_perf',
    topics: ['Elektrotechnik','Schutz','Motoren','SPS','Normen'],
    greeting: 'Ich bin dein **AMPERE KI-Tutor** — fokussiert auf IHK-Prüfungsinhalte für Elektroniker für Betriebstechnik.\n\nIch erkläre Schaltungskonzepte, Schutzmaßnahmen, Motoren, SPS-Grundlagen und Normen.\n\nFrag mich z.B.: _"Was ist der Unterschied zwischen FI und LS?"_',
    chips: ['FI-Schutzschalter erklären','Stern-Dreieck-Anlauf','IP-Schutzart erklären','Schutzklassen I II III','Ohmsches Gesetz Formel','SPS Eingänge Ausgänge','VDE 0100 Grundlagen','Motorschutzschalter Funktion','cos φ und Blindleistung','5-Sicherheitsregeln']
  },
  torque: {
    label: 'TORQUE',
    icon: '🔩',
    color: '#14b8a6',
    beruf: 'Industriemechaniker',
    perfKey: 'tor_topic_perf',
    topics: ['Mechanik','Toleranz','Werkstoffe','Fügen','Pneumatik','Qualität'],
    greeting: 'Ich bin dein **TORQUE KI-Tutor** — fokussiert auf IHK-Prüfungsinhalte für Industriemechaniker.\n\nIch erkläre Toleranzen, Passungen, Werkstoffe, Fügetechniken, Pneumatik und Qualitätssicherung.\n\nFrag mich z.B.: _"Was bedeutet H7/p6?"_',
    chips: ['H7/p6 Passung erklären','Drehmoment berechnen','ISO-Toleranzfeld Grundbegriffe','Schweißnaht Kehlnaht HV','Pascalsches Gesetz','Pneumatikventil 5/2-Wegeventil','Zugversuch Streckgrenze','Härteprüfung HRC HB HV','Qualitätssicherung 6-Sigma','Formtoleranzen Beispiele']
  },
  voltiq: {
    label: 'VOLTIQ',
    icon: '⚡',
    color: '#6366f1',
    beruf: 'Mechatroniker',
    perfKey: null,
    topics: ['Elektrotechnik','Mechanik','SPS','Pneumatik/Hydraulik','Antriebstechnik'],
    greeting: 'Ich bin dein **VOLTIQ KI-Tutor** — fokussiert auf IHK-Prüfungsinhalte für Mechatroniker.\n\nIch erkläre Elektrotechnik, Mechanik, SPS, Pneumatik, Hydraulik und Antriebstechnik.\n\nFrag mich z.B.: _"Was ist der Schlupf beim Asynchronmotor?"_',
    chips: ['Schlupf Asynchronmotor','SPS Programm UND-Verknüpfung','Hydraulikkreislauf Grundprinzip','Drehzahl Drehmoment Leistung','Ohmsches Gesetz Formel','Pneumatikzylinder Kraft berechnen','Encoder inkremental absolut','Frequenzumrichter Funktion','Geberarten NPN PNP','AP2 Fachgespräch Themen']
  },
  fisi: {
    label: 'FISI-Core',
    icon: '🖥️',
    color: '#22c55e',
    beruf: 'Fachinformatiker Systemintegration',
    perfKey: 'fisi_topic_perf',
    topics: ['Netzwerk','Server','Sicherheit','Projektmanagement','Betriebssysteme'],
    greeting: 'Ich bin dein **FISI KI-Tutor** — fokussiert auf IHK-Prüfungsinhalte für Fachinformatiker Systemintegration.\n\nIch erkläre Netzwerke, Server, IT-Sicherheit, Projektmanagement und Betriebssysteme.\n\nFrag mich z.B.: _"Was ist das OSI-Modell?"_',
    chips: ['OSI-Modell 7 Schichten','Subnetting berechnen','RAID 0 1 5 Unterschied','TCP vs UDP Unterschied','VLAN Grundlagen','Active Directory Funktion','Firewall DMZ erklären','IP-Adresse Klassen','DNS DHCP Unterschied','Projektphasen PMBOK']
  }
};

var cfg = APP_CONFIG[APP_ID] || APP_CONFIG.ampere;

// Apply branding
document.getElementById('hdr-icon').textContent = cfg.icon;
document.getElementById('hdr-title').textContent = cfg.label + ' KI-Tutor';
document.getElementById('hdr-sub').textContent = cfg.beruf + ' · offline';
document.title = cfg.label + ' KI-Tutor · Arc Studio';
var backBtn = document.getElementById('back-btn');
if (backBtn) backBtn.title = 'Zurück zu ' + cfg.label;

// ════════════════════════════════════════════════════════════════
// KNOWLEDGE BASES
// ════════════════════════════════════════════════════════════════

var KB = {
  ampere: [
    {keywords:['ohm','ohmsches gesetz','u=ri','spannung strom widerstand'],title:'Ohmsches Gesetz',answer:'**U = R × I**\n\n- U = Spannung in Volt [V]\n- R = Widerstand in Ohm [Ω]\n- I = Strom in Ampere [A]\n\n**Umformen:**\n- R = U / I\n- I = U / R\n\n**Beispiel:** U = 230 V, R = 46 Ω → I = 230/46 = **5 A**'},
    {keywords:['leistung','watt','p=ui','elektrische leistung'],title:'Elektrische Leistung',answer:'**P = U × I = U²/R = I²×R**\n\n- P = Leistung in Watt [W]\n- Einheiten: 1 kW = 1.000 W, 1 MW = 1.000.000 W\n\n**Wirkungsgrad:** η = P_ab / P_zu × 100 %\n\n**Beispiel:** U = 230 V, I = 10 A → P = 2.300 W = 2,3 kW'},
    {keywords:['fi','fehlerstrom','rcd','fi-schutzschalter','personenschutz 30ma'],title:'FI-Schutzschalter (RCD)',answer:'**Funktion:** Vergleicht Hin- und Rückstrom. Bei Differenz ≥ 30 mA → Abschalten in < 300 ms.\n\n**Typen:**\n- Typ A: Wechsel- & pulsierende Gleichfehlerströme\n- Typ B: Zusätzlich glatte Gleichfehlerströme (z.B. FU-Anlagen)\n\n**Normforderung:** 30 mA = Personenschutz, 300 mA = Brandschutz\n\n**Prüfung:** Monatlich Prüftaste drücken'},
    {keywords:['ls','leitungsschutzschalter','sicherungsautomat','mcb','b16','c25','auslösekennlinie'],title:'Leitungsschutzschalter (LS)',answer:'**Funktion:** Schützt Leitungen vor Überlast und Kurzschluss.\n\n**Auslösekennlinien:**\n- **B** (3–5× In): Wohnbereiche, ohmsche Lasten\n- **C** (5–10× In): Motorlasten, Transformatoren\n- **D** (10–20× In): Hohe Anlaufströme\n\n**Selektivität:** Übergeordnete Schutzeinrichtung muss schneller sein\n\n**Kombination:** FI + LS = FI/LS-Kombination'},
    {keywords:['schutzklasse','sk i','sk ii','sk iii','pe anschluss','schutzisolierung'],title:'Schutzklassen I, II, III',answer:'**SK I** — Schutzleiter (PE):\n- Gehäuse mit PE verbunden\n- Fehlerstrom fließt über PE → LS löst aus\n- Beispiel: Waschmaschine, Bohrmaschine\n\n**SK II** — Schutzisolierung:\n- Doppelt oder verstärkt isoliert, kein PE nötig\n- Kennzeichen: ☐ (Quadrat im Quadrat)\n- Beispiel: Handbohrer, Haartrockner\n\n**SK III** — Schutzkleinspannung (SELV/PELV):\n- Max. 50 V AC / 120 V DC\n- Beispiel: LED-Trafos, Spielzeug'},
    {keywords:['ip schutzart','ip54','ip65','ip20','ingress protection','staubschutz spritzwasser'],title:'IP-Schutzarten',answer:'**IP XY** — International Protection\n\n**1. Ziffer (Berührung/Staub):**\n- 0 = kein Schutz\n- 4 = Fremdkörper > 1 mm\n- 5 = Staubgeschützt\n- 6 = Staubdicht\n\n**2. Ziffer (Wasser):**\n- 0 = kein Schutz\n- 4 = Spritzwasser allseitig\n- 5 = Strahlwasser\n- 7 = zeitweises Eintauchen\n\n**Beispiele:** IP54 = staubgeschützt + Spritzwasser | IP65 = staubdicht + Strahlwasser'},
    {keywords:['stern dreieck','y delta','anlauf','stern-dreieck'],title:'Stern-Dreieck-Anlauf',answer:'**Zweck:** Anlaufstrom auf ~1/3 des Direktanlaufs reduzieren.\n\n**Prinzip:**\n1. Start: Motor in Stern (Y) → U = U_Netz / √3\n2. Nach ca. 3–5 Sek.: Umschaltung auf Dreieck (Δ) → volle Spannung\n\n**Strom:** I_Stern = 1/3 × I_Dreieck-Anlauf\n**Drehmoment:** M_Stern = 1/3 × M_Dreieck\n\n**Voraussetzung:** Motor muss für Dreieckbetrieb ausgelegt sein (U_Netz auf Schild = Netzspannung im Δ)'},
    {keywords:['asynchronmotor','drehfeld','schlupf','drehzahl','läufer','ständer'],title:'Drehstrom-Asynchronmotor',answer:'**Ständer:** Erzeugt drehendes Magnetfeld (Drehzahl n₁ = 60f/p)\n**Läufer:** Wird durch Induktion mitgezogen\n\n**Schlupf:** s = (n₁ - n₂) / n₁ × 100 %\n- Nennbetrieb: ca. 2–8 %\n- Stillstand: s = 100 %\n\n**Drehzahl:** n₂ = n₁ × (1 - s)\n\n**Drehmoment:** M = P / (2π × n)\n\n**Motorschutz:** Thermischer Auslöser + LS + FU möglich'},
    {keywords:['motorschutzschalter','überlastrelais','bimetall','thermisch'],title:'Motorschutzschalter',answer:'**Funktion:** Schützt Motoren vor thermischer Überlast.\n\n**Bimetallauslöser:** Biegt sich bei Erwärmung durch Überstrom → löst aus\n**Einstellung:** I_Ein = 0,85 × I_Nenn des Motors\n\n**Merkmale:**\n- Manuelles oder automatisches Rücksetzen\n- Phasenfehler-Erkennung\n- Kombinierbar mit Schütz → Motorstarter\n\n**Abgrenzung zu LS:** Motorschutzschalter = thermisch träge (Motor schützen), LS = schnell (Leitung schützen)'},
    {keywords:['sps','steuerung','speicher','programm','eingang ausgang','input output'],title:'SPS Grundlagen',answer:'**SPS = Speicherprogrammierbare Steuerung**\n\n**Aufbau:**\n- CPU (Prozessor + Speicher)\n- Digitale Eingänge (DI): 24V DC Sensoren\n- Digitale Ausgänge (DO): Aktoren schalten\n- Analoge Ein/Ausgänge (AI/AO): 0–10V, 4–20mA\n\n**Programmierung:** KOP (Kontaktplan), FUP, AWL, ST\n\n**Zyklus:** Eingänge lesen → Programm verarbeiten → Ausgänge setzen\n\n**Beispiel:** Eingangssignal von Sensor → Logik prüfen → Schütz ansteuern'},
    {keywords:['sps timer','ton','tof','zeitglied','zeitverzögerung'],title:'SPS Timer: TON und TOF',answer:'**TON (Timer On-Delay = Einschaltverzögerung):**\n- Eingang IN = 1 → Nach Zeit PT: Ausgang Q = 1\n- Eingang IN = 0 → Ausgang sofort Q = 0\n- Anwendung: Motoranlaufverzögerung\n\n**TOF (Timer Off-Delay = Ausschaltverzögerung):**\n- Eingang IN = 0 → Nach Zeit PT: Ausgang Q = 0\n- Eingang IN = 1 → Ausgang sofort Q = 1\n- Anwendung: Nachlaufsteuerung (Lüfter)\n\n**Parameter:** IN = Startsignal, PT = Sollzeit, ET = Ist-Zeit, Q = Ausgang'},
    {keywords:['vde 0100','installationsnorm','niederspannungsinstallation','schutzmaßnahmen','norm installation'],title:'VDE 0100',answer:'**VDE 0100** = Norm für Errichten von Niederspannungsanlagen\n\n**Wichtige Teile:**\n- Teil 410: Schutz gegen elektrischen Schlag\n- Teil 430: Schutz gegen Überstrom\n- Teil 540: Schutzleiter, Potenzialausgleich\n\n**5 Sicherheitsregeln (VDE 0105):**\n1. Freischalten\n2. Gegen Wiedereinschalten sichern\n3. Spannungsfreiheit feststellen\n4. Erden und Kurzschließen\n5. Benachbarte Teile abdecken\n\n**BGV A3:** Regeln für Prüfung ortsveränderlicher Betriebsmittel'},
    {keywords:['dguv','bgv a3','prüfung','ortsveränderliche','betriebsmittel prüfung'],title:'DGUV V3 / BGV A3 Prüfungen',answer:'**DGUV V3** (früher BGV A3) = Vorschrift elektrischer Anlagen\n\n**Prüffristen ortsveränderliche Betriebsmittel:**\n- Baustellen/Produktion: alle 3 Monate\n- Büro/gering beansprucht: bis 1 Jahr\n\n**Prüfumfang:**\n1. Sichtprüfung (Kabel, Stecker, Gehäuse)\n2. Messung Schutzleiterwiderstand\n3. Messung Isolationswiderstand\n4. Schutzleiterstrommessung\n5. Funktionsprüfung\n\n**Protokollpflicht:** Prüfergebnis dokumentieren, Prüfplakette anbringen'},
    {keywords:['cos phi','leistungsfaktor','blindleistung','wirkleistung','scheinleistung'],title:'Leistungsfaktor cos φ',answer:'**Leistungsdreieck:**\n- S = Scheinleistung [VA]\n- P = Wirkleistung [W] = S × cos φ\n- Q = Blindleistung [var] = S × sin φ\n\n**S² = P² + Q²**\n\n**cos φ = P / S**\n\n**Typische Werte:**\n- Rein ohmscher Widerstand: cos φ = 1\n- Asynchronmotor Nennlast: cos φ ≈ 0,8\n- Motor Leerlauf: cos φ ≈ 0,1\n\n**Kompensation:** Kondensatoren erhöhen cos φ → geringere Blindleistung, niedrigere Netzbelastung'},
    {keywords:['potenzialausgleich','hauptpotenzialausgleich','haupterdungsschiene','pes'],title:'Potenzialausgleich',answer:'**Zweck:** Alle leitfähigen Teile auf gleiches Potenzial bringen → kein gefährlicher Ausgleichsstrom möglich\n\n**Hauptpotenzialausgleich (HPA):**\n- Verbindet: Fundamenterder, Wasserleitung, Gasleitung, Heizungsrohre → Haupterdungsschiene (HES)\n\n**Schutzpotenzialausgleich:** Metallgehäuse, Schienen, Konstruktionen\n\n**Funktionspotenzialausgleich:** Vermeidet Störsignale in empfindlicher Elektronik\n\n**Querschnitt HPA:** min. 6 mm² Cu (oder ½ des PE-Querschnitts, min. 6 mm²)'},
    {keywords:['transformator','trafo','windungen','übersetzung','spannung wicklung'],title:'Transformator',answer:'**Prinzip:** Elektromagnetische Induktion zwischen zwei Wicklungen\n\n**Übersetzungsverhältnis:**\nU₁/U₂ = N₁/N₂ = I₂/I₁\n\n**Leistung:** P₁ ≈ P₂ (Verluste vernachlässigt)\n→ Hohe Spannung = niedriger Strom\n\n**Trenntrafo:** Ü = 1:1, galvanische Trennung → Personenschutz\n**SELV-Trafo:** Ausgangsspannung ≤ 50 V AC, für Schutzkleinspannung\n\n**Verluste:** Kupferverluste (Wicklungswiderstand) + Eisenverluste (Hysterese, Wirbelströme)'}
  ],

  torque: [
    {keywords:['toleranz','passmaß','grundmaß','abmaß','iso 286'],title:'Toleranz & Maße',answer:'**Grundmaß:** Nennmaß des Werkstücks\n**Abmaß:** Abweichung vom Nennmaß\n- Oberes Abmaß (OA): maximale Abweichung nach oben\n- Unteres Abmaß (UA): maximale Abweichung nach unten\n\n**Toleranz T = OA − UA**\n\n**Beispiel:** Ø 50 +0,021/+0,002 → T = 0,021 − 0,002 = 0,019 mm\n\n**ISO-Toleranzfeld:** Buchstabe = Lage, Zahl = Größe (IT-Grad)\n- Großbuchstabe = Bohrung (H7)\n- Kleinbuchstabe = Welle (h6)'},
    {keywords:['passung','spielpassung','übergangspassung','presspassung','h7p6','spielmaß'],title:'Passungen',answer:'**Spielpassung:** Bohrung immer größer als Welle → garantiertes Spiel\n- Beispiel: H7/g6, H7/f7 (Drehlager, Gleitführungen)\n\n**Übergangspassung:** Bohrung ≈ Welle → Spiel oder Übermaß möglich\n- Beispiel: H7/k6, H7/m6 (Kupplungen, Nabensitze)\n\n**Presspassung:** Bohrung immer kleiner als Welle → garantiertes Übermaß\n- Beispiel: H7/p6, H7/s6 (kraftschlüssige Verbindungen)\n- Fügeverfahren: Kaltpressen, Schrumpfen (Wärme), Kühlen'},
    {keywords:['drehmoment','moment','m=f*r','drehmoment berechnen','nm'],title:'Drehmoment',answer:'**M = F × r**\n\n- M = Drehmoment [Nm]\n- F = Kraft [N]\n- r = Hebelarm (Radius) [m]\n\n**Leistung ↔ Drehmoment:**\nP = M × ω = M × 2π × n/60\n\nM = P / (2π × n/60) = P × 60 / (2π × n)\n\n**Beispiel:** P = 5 kW, n = 1450 min⁻¹\nM = 5000 × 60 / (2π × 1450) ≈ **32,9 Nm**\n\n**Anzugsmoment Schrauben:** M_A = k × d × F_V (k ≈ 0,13 mit MoS₂)'},
    {keywords:['werkstoff','stahl','grauguss','aluminium','kupfer','werkstoffkunde','zugfestigkeit','rm re'],title:'Werkstoffe Grundlagen',answer:'**Stahl (Fe + C < 2,06 %):**\n- S235JR: Re ≥ 235 MPa, gut schweißbar\n- C45: Re ≈ 490 MPa, härtbar\n- X5CrNi18-10: Edelstahl, korrosionsbeständig\n\n**Grauguss GJL:** Gut gießbar, spröde, gute Dämpfung\n**Aluminium:** Leicht, korrosionsbeständig, gut spanbar\n**Kupfer:** Beste Leitfähigkeit, weich, teuer\n\n**Kennwerte aus Zugversuch:**\n- Re = Streckgrenze (bleibende Verformung beginnt)\n- Rm = Zugfestigkeit (Höchstkraft)\n- A = Bruchdehnung [%]'},
    {keywords:['zugversuch','streckgrenze','zugfestigkeit','bruchdehnung','spannung dehnung'],title:'Zugversuch',answer:'**Spannungs-Dehnungs-Diagramm:**\n\n1. **Elastischer Bereich:** σ = E × ε (Hooke\'sches Gesetz)\n2. **Streckgrenze Re:** Erste plastische Verformung\n3. **Zugfestigkeit Rm:** Höchste Spannung\n4. **Bruch:** Probe reißt\n\n**Formeln:**\n- σ = F / A₀ [N/mm² = MPa]\n- ε = ΔL / L₀\n- E-Modul Stahl ≈ 210.000 N/mm²\n\n**Prüfnorm:** DIN EN ISO 6892-1'},
    {keywords:['schweißen','mig','tig','e-hand','schweißnaht','kehlnaht','stumpfnaht'],title:'Schweißverfahren',answer:'**MAG/MIG:** Schutzgas + Drahtelektrode\n- MAG = Aktives Gas (CO₂/Ar-Mischung) → Stahl\n- MIG = Inertes Gas (Argon) → Aluminium, NE-Metalle\n\n**WIG (TIG):** Wolframelektrode, Schutzgas Argon\n- Hochwertige Nähte, langsam, für dünnwandige Teile\n\n**E-Hand:** Umhüllte Stabelektrode, keine Gasversorgung nötig\n\n**Nahtarten:**\n- Stumpfnaht (I, V, X): Vollständige Verbindung\n- Kehlnaht: a × Länge (a = 0,7 × Schweißnahtdicke)\n- Kehlnahtdicke berechnen: F = a × l × τ_zul'},
    {keywords:['pneumatik','druckluft','zylinder','ventil','wegeventil','5/2'],title:'Pneumatik Grundlagen',answer:'**Pascalsches Gesetz:** p = F / A\n\n**Pneumatikzylinder Kraft:**\n- Ausfahren: F = p × A_Kolben\n- Einfahren: F = p × (A_Kolben - A_Stange)\n\n**5/2-Wegeventil:**\n- 5 Anschlüsse: P (Zuluft), A, B (Verbraucher), R, S (Entlüftung)\n- 2 Schaltstellungen: Zylinder aus- oder einfahren\n- Betätigung: manuell, pneumatisch, elektrisch (Magnet)\n\n**4/2-Ventil:** wie 5/2, aber R und S verbunden\n\n**Drosseln:** Stromregelventil = Drossel + Rückschlagventil → einseitige Drosselung'},
    {keywords:['härteverfahren','härteprüfung','vickers','brinell','rockwell','hrc','hb hv'],title:'Härteprüfverfahren',answer:'**Vickers (HV):**\n- Eindringkörper: Diamantpyramide 136°\n- Anwendung: alle Werkstoffe, dünne Schichten\n- Formel: HV = 0,189 × F / d²\n\n**Brinell (HB):**\n- Eindringkörper: Hartmetallkugel\n- Große Prüffläche → für grobkörnige Werkstoffe (Grauguss)\n\n**Rockwell (HRC/HRB):**\n- Eindringtiefe gemessen, schnell, direkt ablesbar\n- HRC = Diamantkegel (harte Stähle)\n- HRB = Stahlkugel (weiche Metalle)\n\n**Merksatz:** VBR = Vickers Brinell Rockwell → weich → hart'},
    {keywords:['qualitätssicherung','qs','toleranzprüfung','messmittel','prüfmittel','6 sigma','ppk'],title:'Qualitätssicherung',answer:'**Qualitätsmanagement ISO 9001:** PDCA-Zyklus\n\n**Statistische Prozesskontrolle (SPC):**\n- Normalverteilung: 68-95-99,7% Regel\n- Cpk-Wert: Prozessfähigkeit (> 1,33 = gut)\n- Ausschussrate: 6σ → 3,4 ppm\n\n**Messmittel:**\n- Bügelmessschraube: ±0,01 mm\n- Schieblehre: ±0,05 mm\n- Lehrdorn/-ring: Gut/Ausschuss-Prüfung\n\n**Prüfplanung:** Was prüfen, wie prüfen, wann, Protokoll\n\n**FMEA:** Fehlermöglichkeits- und Einflussanalyse'},
    {keywords:['formtoleranz','geradheit','ebenheit','rundheit','zylinderform','parallelität','rechtwinkligkeit'],title:'Form- und Lagetoleranzen',answer:'**Formtoleranzen (ohne Bezug):**\n- ⏤ Geradheit\n- ⏥ Ebenheit\n- ○ Rundheit\n- ⌭ Zylinderform\n\n**Lagetoleranzen (mit Bezug):**\n- ∥ Parallelität\n- ⊥ Rechtwinkligkeit\n- ∠ Neigung\n- ⌖ Position\n- ◎ Koaxialität\n- ≡ Symmetrie\n\n**Angabe im Toleranzrahmen:**\nSymbol | Wert | Bezug\n\n**Messprinzip:** Antastsystem oder optisch, Auswertung nach DIN EN ISO 1101'},
    {keywords:['schneidstoff','hartmetall','hss','cermet','cbn','wendeplatte','spanwinkel'],title:'Schneidwerkstoffe',answer:'**HSS (Hochschnellstahl):**\n- Bis 600°C, gute Zähigkeit, nachschleifbar\n- Für unterbrochenen Schnitt, komplexe Werkzeuge\n\n**Hartmetall (WC/Co):**\n- Bis 900°C, sehr hart, spröder als HSS\n- Wendeplatten, hohe Schnittgeschwindigkeiten\n- Beschichtungen: TiN (golden), TiAlN, Al₂O₃\n\n**Cermet:** Keramik-Hartmetall-Mischung → sehr glatte Oberflächen\n**CBN (Kubisches Bornitrid):** Härteste Werkstoffe, Hartdrehen\n\n**Schnittgeschwindigkeit:** v_c = π × d × n / 1000 [m/min]'},
    {keywords:['schraubenverbindung','anzugsmoment','vorspannkraft','schrauben festigkeit','8.8 10.9'],title:'Schraubenverbindungen',answer:'**Festigkeitsklassen:**\n- 8.8: R_m = 800 N/mm², R_e = 640 N/mm² (0,8 × 800)\n- 10.9: R_m = 1000 N/mm², R_e = 900 N/mm²\n- 12.9: R_m = 1200 N/mm², R_e = 1080 N/mm²\n\n**Anzugsmoment:**\nM_A = k × d × F_V\n- k ≈ 0,17 (trocken), k ≈ 0,13 (MoS₂)\n- F_V = Vorspannkraft\n\n**Reibschluss:** F_R = μ × F_V\n\n**VDI 2230:** Berechnungsrichtlinie für hochbeanspruchte Schraubenverbindungen'}
  ],

  voltiq: [
    {keywords:['schlupf','asynchronmotor','drehzahl'],title:'Schlupf (Asynchronmotor)',answer:'**s = (n₁ - n₂) / n₁ × 100 %**\n\nn₁ = Synchrondrehzahl (Drehfeld)\nn₂ = Läuferdrehzahl (tatsächlich)\n\n**n₁ = 60 × f / p** (p = Polpaarzahl)\n\n**Beispiel:** f=50Hz, p=2 → n₁=1500/min, n₂=1450/min\ns = (1500-1450)/1500 = 3,3 %\n\n**Nennbetrieb:** ca. 2–8 % Schlupf\nBei s = 100% → Motor steht (Anlauf)'},
    {keywords:['sps','kontaktplan','kop','and','or','not','verknüpfung'],title:'SPS KOP Verknüpfungen',answer:'**KOP = Kontaktplan (Leiterkarte)**\n\n**UND (AND):** Schließer in Reihe\n— A —|— B —( Y ) — \nY = A AND B\n\n**ODER (OR):** Schließer parallel\n— A —( Y ) —\n— B —\nY = A OR B\n\n**NICHT (NOT):** Öffner (/A)\n— /A —( Y ) — Y = NOT A\n\n**Selbsthaltung:**\n— S —|—/R—( Y ) —\n— Y —\nMerksatz: Taste drücken → Selbsthaltung, Öffner unterbricht'},
    {keywords:['hydraulik','pascal','druck kraft fläche','volumenstrom'],title:'Hydraulik Grundlagen',answer:'**Pascalsches Gesetz:** p = F / A\n\n**Druckübersetzung:**\nF₂/F₁ = A₂/A₁\n\n**Volumenstrom:** Q = A × v [l/min]\n\n**Leistung:** P = p × Q\n\n**Hydraulikkreislauf:**\nPumpe → Druckleitung → Ventil → Zylinder → Rücklauf → Tank\n\n**Bauteile:** Pumpe, Sicherheitsventil (max. Druck), Wegeventil (Richtung), Drosselventil (Geschwindigkeit), Filter\n\n**Arbeitsdrücke:** Hydraulik bis 350 bar, Pneumatik max. 10 bar'},
    {keywords:['encoder','geber','inkremental','absolut','resolver','drehgeber'],title:'Encoder / Drehgeber',answer:'**Inkrementalgeber:**\n- Gibt Impulse pro Umdrehung aus (z.B. 1024 Impulse/U)\n- Spur A + Spur B (90° versetzt) → Richtungserkennung\n- Spur Z = Referenzimpuls (1× pro Umdrehung)\n- Nachteil: Verlust bei Stromausfall → Referenzfahrt nötig\n\n**Absolutgeber:**\n- Jede Position eindeutig codiert (Gray-Code)\n- Kein Referenzieren nötig\n- Teurer, mehr Adern\n\n**SSI, EnDat, HIPERFACE:** Digitale Schnittstellen für Absolutgeber'},
    {keywords:['frequenzumrichter','fu','umrichter','drehzahlregelung','vfd'],title:'Frequenzumrichter (FU)',answer:'**Funktion:** Steuert Drehzahl eines Asynchronmotors durch Änderung von Frequenz und Spannung\n\n**Prinzip:**\n1. Gleichrichten (AC → DC, Zwischenkreis)\n2. Pulsbreitenmodulation (DC → variable AC)\n\n**V/f-Kennlinie:** U/f = const → Magnetfluss konstant\n\n**Vorteile:** Sanftanlauf, Energiesparen, Drehzahlstellung\n\n**Bremswiderstand:** Generatorische Bremsenergie wird in Wärme umgewandelt\n\n**EMV:** Abgeschirmte Motorleitungen, Ferritkerne, Erdung wichtig\n\n**Typische Parameter:** Rampenzeit (Hochlauf/Ablauf), Minmal-/Maximalfrequenz, Stromgrenze, Bremsrampe\n\n**Schutzfunktionen:** Überstromschutz, Übertemperaturschutz, Erdschlusserkennung'},
    {keywords:['elektrische leistung','p=ui','wirkungsgrad','eta','leistung berechnen','watt mechatronik'],title:'Elektrische Leistung & Wirkungsgrad',answer:'**Leistungsformel:**\nP = U × I = U² / R = I² × R\n\n- P = Leistung [W]\n- U = Spannung [V]\n- I = Strom [A]\n\n**Dreiphasige Leistung (Drehstrom):**\nP = √3 × U_L × I_L × cos φ\n\n**Beispiel:** U_L = 400 V, I = 10 A, cos φ = 0,85\nP = 1,732 × 400 × 10 × 0,85 ≈ **5.888 W ≈ 5,9 kW**\n\n**Wirkungsgrad:**\nη = P_ab / P_zu × 100 %\n\nP_zu = P_ab + P_Verlust\n\n**Beispiel Motor:** P_mech = 4 kW, P_el = 4,5 kW\nη = 4 / 4,5 × 100 % = **88,9 %**\n\n**Kaskadennutzungsgrad:** η_ges = η₁ × η₂ × η₃ (Getriebe + Motor + FU)'},
    {keywords:['stern dreieck mechatronik','y delta anlauf','anlaufstrom reduzieren','sterndreieck'],title:'Stern-Dreieck-Anlauf (Mechatronik)',answer:'**Zweck:** Anlaufstrom beim Drehstrommotor auf 1/3 reduzieren.\n\n**Ablauf:**\n1. **Start in Stern (Y):** Strangspannung = U_N / √3 ≈ 231 V (bei 400V-Netz)\n2. Nach 3–5 Sekunden: Umschaltung auf **Dreieck (Δ)** → volle 400 V\n\n**Stromverhältnis:**\nI_Stern-Anlauf = 1/3 × I_Dreieck-Anlauf\n\n**Drehmomentverhältnis:**\nM_Stern = 1/3 × M_Dreieck\n\n**SPS-Steuerung:** TON-Timer steuert Umschaltzeitpunkt\n- Y-Schütz schließt → nach PT → Y-Schütz öffnet → Δ-Schütz schließt\n- Verriegelung: Y und Δ dürfen nie gleichzeitig aktiv sein!\n\n**Voraussetzung:** Motor muss im Δ-Betrieb auf Netzspannung ausgelegt sein'},
    {keywords:['sps timer','ton tof','ctu','zähler','counter','aufwärtszähler'],title:'SPS Timer TON/TOF & Zähler CTU',answer:'**TON (Einschaltverzögerung):**\n- IN = 1 → nach PT: Q = 1\n- IN = 0 → Q sofort = 0\n- Beispiel: Motoranlauf verzögern (3 Sek. Vorlauf Pumpe)\n\n**TOF (Ausschaltverzögerung):**\n- IN = 0 → nach PT: Q = 0\n- IN = 1 → Q sofort = 1\n- Beispiel: Lüfter-Nachlauf nach Motorstop\n\n**CTU (Aufwärtszähler - Count Up):**\n- CU = steigt bei jeder steigenden Flanke\n- R = Reset setzt CV auf 0\n- PV = Sollwert, Q = 1 wenn CV ≥ PV\n- Beispiel: 10 Teile zählen → Förderband stoppen\n\n**CTD (Abwärtszähler):** zählt von PV auf 0\n**CTUD:** Kombinierter Auf/Abwärtszähler\n\n**Parameter:** CU/CD = Zähleingang, R/LD = Reset/Laden, PV = Sollwert, Q = Ausgang, CV = Istwert'},
    {keywords:['pneumatikzylinder','kraft zylinder','f=pa','kolbenkraft','pneumatik kraft'],title:'Pneumatikzylinder – Kraft berechnen',answer:'**Grundformel:**\nF = p × A\n\n- F = Kraft [N]\n- p = Druck [Pa] bzw. [bar] (1 bar = 100.000 Pa)\n- A = Fläche [m²]\n\n**Ausfahren (Kolbenseite):**\nF_aus = p × (π × d_K² / 4)\n\n**Einfahren (Stangenseite):**\nF_ein = p × (π × (d_K² - d_S²) / 4)\n→ geringere Kraft, da Stange Fläche reduziert\n\n**Beispiel:**\np = 6 bar = 600.000 Pa, d_K = 80 mm = 0,08 m\nA = π × 0,08² / 4 = 0,005027 m²\nF = 600.000 × 0,005027 = **3.016 N ≈ 3 kN**\n\n**Druckumrechnung:** 1 bar = 10 N/cm² → vereinfacht: F [N] = p [bar] × A [cm²] × 10'},
    {keywords:['hydraulik druckübersetzung','volumenstrom','hydraulikzylinder','q=av','hydraulische übersetzung'],title:'Hydraulik – Druckübersetzung & Volumenstrom',answer:'**Pascalsches Gesetz:**\nDruck pflanzt sich in Flüssigkeiten gleichmäßig fort.\n\n**Druckübersetzung (Kraftverstärkung):**\np = F₁/A₁ = F₂/A₂\n\nF₂ = F₁ × (A₂/A₁)\n\n**Beispiel:** F₁ = 100 N, A₁ = 1 cm², A₂ = 10 cm²\nF₂ = 100 × 10 = **1.000 N** → 10-fache Kraft\n\n**Volumenstrom:**\nQ = A × v [m³/s oder l/min]\n\n**Kontinuitätsgesetz:**\nA₁ × v₁ = A₂ × v₂\n→ kleine Fläche = höhere Geschwindigkeit\n\n**Leistung Hydraulik:**\nP = p × Q\n\n**Arbeitsdrücke:**\n- Hydraulik: bis 350 bar (hochdruckbelastet)\n- Pneumatik: max. 10 bar\n\n**Sicherheitsventil:** begrenzt maximalen Systemdruck (Überdruckventil)'},
    {keywords:['schrittmotor','servo','asynchronmotor','vergleich','motorarten','antrieb vergleich'],title:'Schrittmotor vs. Servo vs. Asynchronmotor',answer:'**Schrittmotor:**\n- Bewegt sich in definierten Schritten (z.B. 1,8°/Schritt = 200 Schritte/U)\n- Keine Rückmeldung nötig (open-loop)\n- Günstig, einfach anzusteuern\n- Nachteil: Schrittverlust bei Überlast möglich\n- Einsatz: 3D-Drucker, CNC-Achsen, einfache Positionierung\n\n**Servomotor:**\n- Bürstenloser DC oder AC-Motor mit Lageregelung\n- Encoder liefert Istwert → Regler korrigiert\n- Hochdynamisch, präzise, teuer\n- Einsatz: Roboterachsen, Werkzeugmaschinen, Verpackungsanlagen\n\n**Asynchronmotor:**\n- Robust, wartungsarm, günstig\n- Drehzahl nicht exakt regelbar (Schlupf)\n- Mit FU: Drehzahl stufenlos einstellbar\n- Einsatz: Pumpen, Lüfter, Förderbänder\n\n**Vergleich:** Schrittmotor = einfach/billig, Servo = präzise/teuer, ASM = robust/universell'},
    {keywords:['sensor','induktiv','kapazitiv','optisch','ultraschall','näherungsschalter','sensortechnik'],title:'Sensortechnik: induktiv, kapazitiv, optisch, Ultraschall',answer:'**Induktiver Sensor:**\n- Erkennt nur metallische Objekte\n- Prinzip: Dämpfung eines Schwingkreises durch Wirbelströme\n- Schaltabstand: 1–40 mm (je nach Bauform)\n- Einsatz: Metallteile erkennen, Endlagen\n\n**Kapazitiver Sensor:**\n- Erkennt Metalle UND Nichtmetalle (Kunststoff, Flüssigkeiten)\n- Prinzip: Änderung der Kapazität durch Annäherung\n- Einsatz: Füllstandsmessung, Papier, Glas\n\n**Optischer Sensor (Lichtschranke/Reflexion):**\n- Einweg: Sender und Empfänger gegenüber\n- Reflex: Rückstrahler oder diffuse Reflexion\n- Empfindlich gegenüber Verschmutzung\n- Einsatz: Objekte beliebiger Materialien\n\n**Ultraschallsensor:**\n- Misst Laufzeit von Schallwellen\n- Unabhängig von Farbe/Material\n- Einsatz: Abstandsmessung, Füllstand\n\n**Ausgangstypen:** NPN (Minusschaltend), PNP (Plusschaltend), NO/NC (Öffner/Schließer)'},
    {keywords:['robotik','tcp','tool center point','arbeitsraum','kinematik','roboter grundlagen'],title:'Robotik: TCP, Arbeitsraum, Kinematik',answer:'**TCP (Tool Center Point):**\n- Referenzpunkt des Werkzeugs am Roboterflansch\n- Alle Bahnen und Positionen beziehen sich auf den TCP\n- Muss kalibriert werden (4-Punkt-Methode)\n\n**Arbeitsraum:**\n- Bereich, den der TCP erreichenkann\n- Abhängig von Achsenanzahl und Armlängen\n- Singularitäten: Positionen, in denen Achsen fluchten → problematisch\n\n**Kinematik:**\n- **Vorwärtskinematik:** Achswinkel → TCP-Position berechnen\n- **Inverse Kinematik:** TCP-Position → Achswinkel berechnen (mehrere Lösungen möglich)\n\n**Robotertypen:**\n- Knickarm (6 Achsen): universell, hoher Arbeitsraum\n- SCARA: schnell, für planare Aufgaben\n- Delta-Roboter: sehr schnell, Leichtbau\n- Portalroboter (kartesisch): präzise, lineares System\n\n**Koordinatensysteme:** Welt, Basis, Werkzeug (TCP), Werkstück'},
    {keywords:['ohmsches gesetz','kirchhoff','knotenregel','maschenregel','netzwerkanalyse'],title:'Ohmsches Gesetz + Kirchhoffsche Regeln',answer:'**Ohmsches Gesetz:**\nU = R × I → R = U/I → I = U/R\n\n**Reihenschaltung:**\nR_ges = R₁ + R₂ + R₃\nI = const., U_ges = U₁ + U₂ + U₃\n\n**Parallelschaltung:**\n1/R_ges = 1/R₁ + 1/R₂ + 1/R₃\nU = const., I_ges = I₁ + I₂ + I₃\n\n**1. Kirchhoffsches Gesetz (Knotenregel):**\nΣ I_zufließend = Σ I_abfließend\n→ In einem Knoten ist die Summe aller Ströme = 0\n\n**2. Kirchhoffsches Gesetz (Maschenregel):**\nΣ U = 0 (im geschlossenen Umlauf)\n→ Summe aller Spannungen in einer Masche = 0\n\n**Beispiel Masche:** U_Q = U_R1 + U_R2\n→ 24 V = I × 4 Ω + I × 8 Ω → I = 2 A'},
    {keywords:['wechselstrom','frequenz','amplitude','rms','effektivwert','cos phi wechselstrom'],title:'Wechselstrom: Frequenz, Amplitude, RMS, cos φ',answer:'**Sinusförmiger Wechselstrom:**\nu(t) = Û × sin(2π × f × t)\n\n- Û = Amplitude (Scheitelwert) [V]\n- f = Frequenz [Hz] (Europa: 50 Hz)\n- T = 1/f = Periodendauer [s]\n\n**Effektivwert (RMS):**\nU_eff = Û / √2 ≈ 0,707 × Û\n\n**Beispiel:** Û = 325 V → U_eff = 325 / 1,414 ≈ **230 V** (Hausnetz)\n\n**Leistungsfaktor cos φ:**\n- φ = Phasenverschiebung zwischen U und I\n- cos φ = 1: rein ohmscher Widerstand\n- cos φ < 1: induktive oder kapazitive Last (Motor)\n\n**Leistungen:**\n- Wirkleistung: P = U × I × cos φ [W]\n- Blindleistung: Q = U × I × sin φ [var]\n- Scheinleistung: S = U × I [VA]\n- S² = P² + Q²'},
    {keywords:['pid','regler','p-anteil','i-anteil','d-anteil','regelkreis','pid regler'],title:'PID-Regler: P, I, D-Anteil',answer:'**Regelkreis:**\nSollwert (w) → Regler → Strecke → Istwert (x)\nRegelabweichung: e = w - x\n\n**P-Anteil (Proportional):**\n- Ausgang ∝ Regelabweichung\n- Y_P = K_P × e\n- Schnell, aber bleibende Regelabweichung möglich\n\n**I-Anteil (Integral):**\n- Summiert Regelabweichung über Zeit\n- Beseitigt bleibende Regelabweichung\n- Reagiert langsam, kann zu Schwingungen führen\n\n**D-Anteil (Differential):**\n- Reagiert auf Änderungsgeschwindigkeit der Abweichung\n- Dämpft Schwingungen, schnelle Reaktion auf Störungen\n- Empfindlich gegenüber Messrauschen\n\n**PID gesamt:** Y = K_P × (e + 1/T_I × ∫e dt + T_D × de/dt)\n\n**Einstellregeln (Ziegler-Nichols):** Kritische Verstärkung und Periodendauer messen → Richtwerte ableiten\n\n**Anwendungen:** Temperaturregelung, Drehzahlregelung, Lageregelung'},
    {keywords:['fehlersuche','diagnose','voltmeter','strommessung','oszilloskop','messtechnik'],title:'Fehlersuche & Diagnose mit Messmitteln',answer:'**Systematische Fehlersuche:**\n1. Fehlerbeschreibung aufnehmen\n2. Sichtprüfung (Kabel, Sicherungen, Verbindungen)\n3. Spannungsversorgung prüfen\n4. Signalverfolgung (Eingang → Ausgang)\n5. Fehler eingrenzen → beheben → testen\n\n**Voltmeter (Multimeter - Spannungsmessung):**\n- Parallel zum Verbraucher schalten\n- Hoher Innenwiderstand (>10 MΩ)\n- AC/DC beachten\n\n**Amperemeter (Strommessung):**\n- In Reihe schalten (Stromkreis unterbrechen!)\n- Stromzange: berührungslos, keine Unterbrechung nötig\n\n**Oszilloskop:**\n- Zeigt Spannungsverlauf über Zeit\n- Erkennt: Oberschwingungen, Impulse, Phasenlagen, Störspitzen\n- Trigger einstellen für stabile Darstellung\n- Tastteiler 1:1 / 1:10 beachten\n\n**SPS-Diagnose:** Online-Monitoring im Kontaktplan, Forcen von Variablen, Fehlerregister auslesen'},
    {keywords:['schutzmaßnahmen','fi schalter','ls schalter','schutzklassen','fehlerschutz'],title:'Schutzmaßnahmen: FI, LS, Schutzklassen',answer:'**FI-Schutzschalter (RCD):**\n- Vergleicht Hin- und Rückstrom\n- Differenz ≥ 30 mA → Abschalten < 300 ms\n- Personenschutz (30 mA) und Brandschutz (300 mA)\n- Typ A: AC + pulsierende DC-Fehlerströme\n- Typ B: auch glatte Gleichfehlerströme (FU-Anlagen)\n\n**LS-Schutzschalter (MCB):**\n- Schützt Leitungen vor Überstrom und Kurzschluss\n- Kennlinie B (3–5×), C (5–10×), D (10–20×)\n\n**Schutzklasse I:** Schutzleiter (PE), Gehäuse geerdet\n**Schutzklasse II:** Schutzisolierung, kein PE, Symbol ☐\n**Schutzklasse III:** Schutzkleinspannung ≤ 50 V AC\n\n**5 Sicherheitsregeln (VDE 0105):**\n1. Freischalten\n2. Gegen Wiedereinschalten sichern\n3. Spannungsfreiheit feststellen\n4. Erden und Kurzschließen\n5. Benachbarte Teile abdecken/absperren'},
    {keywords:['getriebe','übersetzung','übersetzungsverhältnis','i=n1/n2','drehzahl getriebe','getriebe berechnen'],title:'Getriebe – Übersetzungsverhältnis',answer:'**Übersetzungsverhältnis i:**\ni = n₁ / n₂ = M₂ / M₁ = z₂ / z₁\n\n- n₁ = Antriebsdrehzahl [min⁻¹]\n- n₂ = Abtriebsdrehzahl [min⁻¹]\n- M₁ = Antriebsmoment [Nm]\n- M₂ = Abtriebsmoment [Nm]\n- z = Zähnezahl (bei Zahnradgetriebe)\n\n**i > 1:** Untersetzung → n sinkt, M steigt\n**i < 1:** Übersetzung (ins Schnelle) → n steigt, M sinkt\n\n**Beispiel:**\nn₁ = 1450 min⁻¹, n₂ = 145 min⁻¹\ni = 1450 / 145 = **10** (10-fache Untersetzung)\nM₂ = M₁ × i × η = 10 Nm × 10 × 0,95 = **95 Nm**\n\n**Getriebebauarten:**\n- Stirnradgetriebe: hoher Wirkungsgrad (η ≈ 0,98)\n- Schneckengetriebe: große Übersetzung, selbsthemmend, η ≈ 0,5–0,9\n- Planetengetriebe: kompakt, hohe Leistungsdichte\n\n**Wirkungsgrad beachten:** P_ab = P_an × η'},
    {keywords:['npn pnp','transistor ausgang','geberausgang','npn pnp sensor','sensoranschluss','plus schaltend minus schaltend'],title:'NPN vs. PNP – Sensorausgänge',answer:'**PNP-Ausgang (Plusschaltend):**\n- Schaltet den Verbraucher auf Plus (24 V)\n- Verbraucher zwischen Ausgang und GND (Minus)\n- Standard in Europa bei Industriesensoren\n- Auch: "High-Side-Schalter"\n\n**NPN-Ausgang (Minusschaltend):**\n- Schaltet den Verbraucher auf Minus (GND)\n- Verbraucher zwischen +24 V und Ausgang\n- Standard in Asien/Japan\n- Auch: "Low-Side-Schalter"\n\n**Anschluss an SPS-Eingang:**\n- PNP → Eingang zeigt HIGH wenn Sensor aktiv → Eingang gegen GND\n- NPN → Eingang zeigt LOW wenn Sensor aktiv → Eingang gegen +24 V (Source-Eingang)\n\n**3-Leiter-Anschluss:**\n- Braun: +24 V (Versorgung)\n- Blau: GND (0 V)\n- Schwarz: Schaltausgang\n\n**NO / NC:**\n- NO (Normally Open / Schließer): Ausgang aktiv wenn Objekt erkannt\n- NC (Normally Closed / Öffner): Ausgang inaktiv wenn Objekt erkannt\n\n**Merksatz:** PNP = Plus-schaltend, NPN = Negativ (Minus-schaltend)'}

  fisi: [
    {keywords:['osi','osi modell','schichten','schichtenmodell','referenzmodell'],title:'OSI-Modell (7 Schichten)',answer:'**7 Schichten von unten:**\n1. **Bitübertragung** — Kabel, Signale (Hub)\n2. **Sicherung** — MAC-Adresse, Frames (Switch)\n3. **Vermittlung** — IP-Adresse, Routing (Router)\n4. **Transport** — TCP/UDP, Ports, Segmente\n5. **Sitzung** — Verbindungsaufbau/-abbau\n6. **Darstellung** — Verschlüsselung, Kodierung\n7. **Anwendung** — HTTP, FTP, DNS, SMTP\n\n**Eselsbrücke:** _"Alle Deutschen Studenten Trinken Verschiedene Sorten Bier"_\n(7↓1: Anw. Dar. Si. Tr. Ve. Si. Bi.)'},
    {keywords:['subnetting','subnetz','netzmaske','cidr','ip rechnen'],title:'Subnetting',answer:'**Subnetzmaske:** Trennt Netz- von Hostteil\n- /24 = 255.255.255.0 → 254 Hosts\n- /25 = 255.255.255.128 → 126 Hosts\n- /26 = 255.255.255.192 → 62 Hosts\n\n**Berechnung:**\nAnzahl Hosts = 2^(32-Präfix) - 2\n\n**Beispiel 192.168.1.0/26:**\n- Netzadresse: 192.168.1.0\n- Broadcast: 192.168.1.63\n- Nutzbare Hosts: .1 – .62 (62 Stück)\n\n**VLSM:** Variable Subnetzmasken je nach Bedarf'},
    {keywords:['tcp','udp','unterschied','protokoll','verbindungsorientiert'],title:'TCP vs UDP',answer:'**TCP (Transmission Control Protocol):**\n- Verbindungsorientiert (3-Way Handshake: SYN → SYN-ACK → ACK)\n- Zuverlässig: Bestätigung, Neuübertragung bei Verlust\n- Reihenfolge garantiert\n- Anwendung: HTTP/S, FTP, E-Mail, SSH\n\n**UDP (User Datagram Protocol):**\n- Verbindungslos, kein Handshake\n- Kein Zustellungsnachweis\n- Schneller, weniger Overhead\n- Anwendung: DNS, DHCP, Video-Streaming, VoIP\n\n**Merksatz:** TCP = Telefon (zuverlässig), UDP = Brief ohne Einschreiben'},
    {keywords:['raid','raid 0','raid 1','raid 5','raid 6','redundanz','striping','mirroring'],title:'RAID-Level',answer:'**RAID 0 (Striping):**\n- Daten aufgeteilt, hohe Geschwindigkeit\n- Keine Redundanz — Ausfall 1 Disk → alles verloren\n\n**RAID 1 (Mirroring):**\n- Daten gespiegelt, 50% Kapazität nutzbar\n- 1 Disk darf ausfallen\n\n**RAID 5:**\n- Striping + verteilte Parität (mind. 3 Disks)\n- 1 Disk darf ausfallen, gute Kapazitätsnutzung\n- Kapazität = (n-1) × kleinste Disk\n\n**RAID 6:** wie RAID 5, aber 2 Disks dürfen ausfallen\n**RAID 10:** RAID 1+0, gespiegelte Stripes, schnell und sicher'},
    {keywords:['dns','dhcp','unterschied','namensauflösung','ip vergabe'],title:'DNS & DHCP',answer:'**DNS (Domain Name System):**\n- Übersetzt Domainnamen in IP-Adressen\n- Beispiel: google.de → 142.250.185.35\n- Port: **53** (UDP für Abfragen, TCP für Zonentransfer)\n- Hierarchie: Root → TLD (.de) → Domain → Subdomain\n\n**DHCP (Dynamic Host Configuration Protocol):**\n- Vergibt automatisch: IP, Subnetzmaske, Gateway, DNS\n- Port: **67** (Server), **68** (Client)\n- DORA-Prozess: Discover → Offer → Request → Acknowledge\n\n**Statische IP:** Manuell gesetzt (für Server, Drucker, Router)'},
    {keywords:['ipv4 ipv6','ipv6 adresse','ipv6 unterschied','dual stack','adressaufbau ipv6'],title:'IPv4 vs. IPv6',answer:'**IPv4:**\n- 32 Bit, 4 Oktette: 192.168.1.1\n- Ca. 4,3 Milliarden Adressen (erschöpft)\n- NAT nötig für private Netze\n- Klassen A, B, C, D, E (historisch)\n\n**IPv6:**\n- 128 Bit, 8 Gruppen à 16 Bit (Hex): 2001:0db8:85a3::8a2e:0370:7334\n- 340 Sextillionen Adressen → kein NAT nötig\n- Vereinfachung: führende Nullen weglassen, :: für aufeinanderfolgende 0-Blöcke\n\n**Wichtige IPv6-Adressen:**\n- ::1 = Loopback (wie 127.0.0.1)\n- fe80::/10 = Link-Local (nicht routbar, auto-konfiguriert)\n- 2001::/32 = Globale Unicast-Adressen\n\n**Unterschiede:**\n- Kein Broadcast in IPv6 (Multicast stattdessen)\n- ICMPv6 ersetzt ARP (Neighbor Discovery)\n- IPSec in IPv6 integriert\n\n**Dual Stack:** Gerät hat gleichzeitig IPv4 und IPv6-Adresse'},
    {keywords:['vlan','trunk','access port','802.1q','vlan tagging','virtual lan'],title:'VLANs – Trunk, Access Port, 802.1Q',answer:'**VLAN (Virtual Local Area Network):**\n- Logische Trennung des Netzwerks auf Schicht 2\n- Trennt Broadcast-Domänen ohne physische Trennung\n- Erhöht Sicherheit und Übersichtlichkeit\n\n**Access Port:**\n- Verbindet Endgerät mit einem VLAN\n- Port gehört genau einem VLAN\n- Frame wird ungetaggt weitergeleitet\n\n**Trunk Port:**\n- Verbindet Switches untereinander oder mit Router\n- Überträgt mehrere VLANs gleichzeitig\n- Frames werden mit **802.1Q-Tag** markiert (4 Byte Header)\n- Tag enthält VLAN-ID (12 Bit = max. 4094 VLANs)\n\n**Native VLAN:**\n- Frames ohne Tag gehören zum Native VLAN (Standard: VLAN 1)\n- Sicherheitsempfehlung: Native VLAN ändern\n\n**Router-on-a-Stick:**\nEin physischer Router-Port → mehrere Sub-Interfaces je VLAN → Inter-VLAN-Routing\n\n**Beispiel Konfiguration (Cisco):**\ninterface fa0/1 → switchport mode access → switchport access vlan 10'},
    {keywords:['routing','statisch','dynamisch','ospf','bgp','routing protokoll'],title:'Routing – statisch vs. dynamisch, OSPF, BGP',answer:'**Statisches Routing:**\n- Routen manuell eingetragen\n- Kein Overhead, volle Kontrolle\n- Bei Änderungen manuell anpassen\n- Einsatz: kleine Netze, Default-Route\n\n**Dynamisches Routing:**\n- Router tauschen Routing-Informationen aus\n- Automatische Anpassung bei Topologieänderungen\n- Einsatz: größere/komplexe Netze\n\n**OSPF (Open Shortest Path First):**\n- Link-State-Protokoll (kennt gesamte Topologie)\n- Algorithmus: Dijkstra (kürzester Pfad)\n- Metrik: Kosten = 100 Mbit/s / Bandbreite\n- Interior Gateway Protocol (IGP), innerhalb einer AS\n- Bereiche (Areas) für Skalierbarkeit\n\n**BGP (Border Gateway Protocol):**\n- Exterior Gateway Protocol (EGP)\n- Verbindet autonome Systeme (AS) im Internet\n- Path-Vector-Protokoll\n- Standard-Routing-Protokoll des Internets\n- Sehr viele Parameter (Policies, AS-Path, MED)\n\n**Administrative Distance:** RIP=120, OSPF=110, BGP=20 (eBGP)'},
    {keywords:['active directory','domäne','ou','gpo','ad','benutzer gruppen','ldap'],title:'Active Directory – Domäne, OU, GPO',answer:'**Active Directory (AD):**\n- Verzeichnisdienst von Microsoft\n- Zentrale Verwaltung von Benutzern, Computern, Gruppen\n- Protokoll: **LDAP** (Port 389/636)\n- Authentifizierung: **Kerberos**\n\n**Domäne:**\n- Logische Verwaltungseinheit mit gemeinsamer Datenbank\n- Domain Controller (DC) speichert die AD-Datenbank (NTDS.dit)\n- Forest → Domäne → OU (Hierarchie)\n\n**OU (Organizational Unit):**\n- Ordner-Struktur innerhalb der Domäne\n- Zur Organisation von Objekten\n- Auf OUs werden GPOs angewendet\n\n**GPO (Group Policy Object):**\n- Einstellungen für Benutzer und Computer\n- Beispiele: Desktop-Hintergrund erzwingen, Software verteilen, Passwort-Policy\n- Reihenfolge: Local → Site → Domäne → OU\n\n**Gruppen:**\n- Sicherheitsgruppen: Berechtigungen zuweisen\n- Verteilergruppen: E-Mail-Verteilung\n- Gültigkeitsbereiche: Lokal, Global, Universal'},
    {keywords:['linux befehle','ls','chmod','chown','grep','systemctl','linux grundbefehle'],title:'Linux-Grundbefehle',answer:'**Navigation:**\n- `ls -la` — Dateien auflisten (inkl. Berechtigungen)\n- `cd /etc` — Verzeichnis wechseln\n- `pwd` — aktuelles Verzeichnis anzeigen\n\n**Berechtigungen:**\n- `chmod 755 datei` — Rechte setzen (r=4, w=2, x=1)\n- `chmod +x script.sh` — Ausführbar machen\n- `chown user:gruppe datei` — Besitzer ändern\n\n**Suchen & Filtern:**\n- `grep "fehler" /var/log/syslog` — in Dateien suchen\n- `grep -r "text" /etc/` — rekursiv suchen\n- `grep -i` — Groß-/Kleinschreibung ignorieren\n\n**Dienste (systemd):**\n- `systemctl status nginx` — Status prüfen\n- `systemctl start/stop/restart nginx` — Dienst steuern\n- `systemctl enable nginx` — Autostart aktivieren\n\n**Nützliches:**\n- `cat datei.txt` — Dateiinhalt anzeigen\n- `tail -f /var/log/syslog` — Log live verfolgen\n- `ps aux` — Prozesse anzeigen\n- `df -h` — Festplattennutzung\n- `ip addr` — IP-Adressen anzeigen'},
    {keywords:['windows server','dhcp server einrichten','dns konfigurieren','rollen','windows server administration'],title:'Windows Server: DHCP & DNS einrichten',answer:'**DHCP-Server einrichten (Windows Server):**\n1. Rolle hinzufügen: Server-Manager → Rollen → DHCP-Server\n2. DHCP-Bereich erstellen: IP-Range, Subnetzmaske, Ausschlussbereiche\n3. Optionen konfigurieren: Standard-Gateway (003), DNS-Server (006)\n4. Bereich aktivieren\n5. DHCP-Server autorisieren (in AD-Umgebung)\n\n**Lease-Dauer:** Standard 8 Tage → nach Ablauf: IP wieder freigegeben\n**Reservierungen:** MAC-Adresse → feste IP (für Drucker, Server)\n\n**DNS-Server konfigurieren:**\n1. Rolle hinzufügen: DNS-Server\n2. Forward Lookup Zone erstellen (Name → IP)\n3. Reverse Lookup Zone erstellen (IP → Name)\n4. A-Records (Host) und PTR-Records (Reverse) hinzufügen\n5. Weiterleitung (Forwarder) zu öffentlichem DNS einrichten (z.B. 8.8.8.8)\n\n**DNS-Recordtypen:**\n- A: IPv4-Adresse\n- AAAA: IPv6-Adresse\n- MX: Mail-Server\n- CNAME: Alias\n- NS: Nameserver'},
    {keywords:['firewall','stateful','stateless','dmz','nat','pat','firewall arten'],title:'Firewall – Stateful/Stateless, DMZ, NAT',answer:'**Paketfilter (Stateless):**\n- Prüft einzelne Pakete: IP, Port, Protokoll\n- Keine Verbindungsverfolgung\n- Schnell, einfach, aber eingeschränkt\n\n**Stateful Inspection:**\n- Verfolgt Verbindungszustände (Connection Tracking)\n- Rückantworten automatisch erlaubt\n- Standard in modernen Firewalls\n\n**Application Layer Firewall (WAF):**\n- Analysiert Anwendungsprotokoll (HTTP, FTP)\n- Deep Packet Inspection\n\n**DMZ (Demilitarisierte Zone):**\n- Netz zwischen Internet und Intranet\n- Für öffentlich erreichbare Server (Webserver, Mailserver)\n- Kompromittierter Server kann nicht ins Intranet\n\n**NAT (Network Address Translation):**\n- Übersetzt private IP → öffentliche IP\n- Viele Geräte teilen eine öffentliche IP\n\n**PAT (Port Address Translation):**\n- Erweiterung von NAT mit Ports\n- 192.168.1.x:Port → 1.2.3.4:anderer Port\n- Auch "Masquerading" genannt\n\n**Firewall-Regeln:** Source-IP, Dest-IP, Port, Protokoll, Aktion (Allow/Deny)'},
    {keywords:['wlan','wifi','802.11','wpa2','wpa3','2.4ghz','5ghz','wireless'],title:'WLAN – Standards, WPA2/WPA3, Frequenzen',answer:'**WLAN-Standards (IEEE 802.11):**\n- 802.11b: 2,4 GHz, max. 11 Mbit/s (veraltet)\n- 802.11g: 2,4 GHz, max. 54 Mbit/s\n- 802.11n (WiFi 4): 2,4 + 5 GHz, bis 600 Mbit/s\n- 802.11ac (WiFi 5): 5 GHz, bis 6,9 Gbit/s\n- 802.11ax (WiFi 6): 2,4 + 5 + 6 GHz, bis 9,6 Gbit/s\n\n**Frequenzbänder:**\n- **2,4 GHz:** Größere Reichweite, weniger Kanäle (1, 6, 11 überlappungsfrei), mehr Störquellen\n- **5 GHz:** Kürzere Reichweite, mehr Kanäle, weniger Interferenz, höhere Datenrate\n\n**Sicherheitsstandards:**\n- WEP: veraltet, leicht knackbar\n- WPA: TKIP, besser als WEP, aber nicht mehr sicher\n- **WPA2:** AES-Verschlüsselung, aktueller Standard, PSK oder Enterprise (802.1X)\n- **WPA3:** Verbesserte Authentifizierung (SAE), Forward Secrecy\n\n**SSID:** Netzwerkname; **BSSID:** MAC des Access Points\n**Roaming:** 802.11r (Fast Transition) für nahtlosen AP-Wechsel'},
    {keywords:['backup','sicherung','vollsicherung','differenziell','inkrementell','backup strategie'],title:'Backup-Strategien: Voll, Differenziell, Inkrementell',answer:'**Vollsicherung:**\n- Alle Daten werden gesichert\n- Längste Sicherungszeit, größter Speicherbedarf\n- Schnellste Wiederherstellung (nur 1 Band/Datei nötig)\n\n**Differenzielle Sicherung:**\n- Sichert alle Änderungen seit letzter Vollsicherung\n- Wächst täglich\n- Wiederherstellung: Vollsicherung + letzte differenzielle Sicherung\n\n**Inkrementelle Sicherung:**\n- Sichert nur Änderungen seit letzter Sicherung (egal ob Voll oder Inkrementell)\n- Kleinste Sicherungsgröße, schnellste Sicherung\n- Wiederherstellung: Vollsicherung + alle Inkremente (aufwendiger)\n\n**3-2-1-Regel:**\n- **3** Kopien der Daten\n- **2** verschiedene Speichermedien\n- **1** Kopie offsite (extern, Cloud)\n\n**RPO (Recovery Point Objective):** max. Datenverlust akzeptiert\n**RTO (Recovery Time Objective):** max. Ausfallzeit akzeptiert\n\n**Backup-Test:** Regelmäßiges Testen der Wiederherstellung!'},
    {keywords:['it grundschutz','bsi','dsgvo','datenschutz','informationssicherheit','isms'],title:'IT-Grundschutz, BSI & DSGVO',answer:'**BSI-Grundschutz:**\n- Bundesamt für Sicherheit in der Informationstechnik\n- BSI-Grundschutz-Kompendium: Standardsicherheitsmaßnahmen\n- ISMS = Information Security Management System\n- Norm: **ISO 27001** (internationaler Standard)\n\n**Schutzziele (CIA):**\n- **Confidentiality (Vertraulichkeit):** Nur Berechtigte haben Zugriff\n- **Integrity (Integrität):** Daten unverändert und korrekt\n- **Availability (Verfügbarkeit):** Systeme bei Bedarf erreichbar\n\n**DSGVO (Datenschutz-Grundverordnung):**\n- EU-weit gültig seit Mai 2018\n- Personenbezogene Daten schützen\n- **Rechte der Betroffenen:** Auskunft, Löschung, Berichtigung, Datenportabilität\n- **Pflichten:** Verarbeitungsverzeichnis, Datenschutzbeauftragter (DSB) ab 20 MA, Meldepflicht bei Datenpanne (72 Std.)\n- Bußgelder bis 20 Mio. € oder 4 % des Jahresumsatzes\n\n**Technische Maßnahmen:** Verschlüsselung, Zugriffskontrollen, Pseudonymisierung'},
    {keywords:['projektmanagement','wasserfall','agil','scrum','sprint','kanban'],title:'Projektmanagement: Wasserfall vs. Agil/Scrum',answer:'**Wasserfallmodell:**\n- Sequenzielle Phasen: Anforderung → Design → Implementierung → Test → Einführung\n- Nächste Phase beginnt erst nach Abschluss der vorherigen\n- Vorteil: klare Struktur, gut planbar\n- Nachteil: Änderungen spät möglich, Kundenfeedback erst am Ende\n\n**Agiles Vorgehen:**\n- Iterativ, inkrementell, flexibel\n- Kundeneinbindung während des gesamten Projekts\n- Grundlagen: **Agiles Manifest** (12 Prinzipien)\n\n**Scrum (Framework):**\n- Rollen: **Product Owner** (Anforderungen), **Scrum Master** (Prozess), **Entwicklungsteam**\n- **Sprint:** 1–4 Wochen, feste Iteration\n- **Product Backlog:** Priorisierte Anforderungsliste\n- **Sprint Backlog:** Aufgaben für aktuellen Sprint\n- **Daily Scrum:** 15 min tägliches Meeting\n- **Sprint Review + Retrospektive:** Am Sprintende\n\n**Kanban:** Workflow-Visualisierung mit Boards (To Do / In Progress / Done)'},
    {keywords:['cloud','iaas','paas','saas','on premise','cloud dienste'],title:'Cloud-Konzepte: IaaS, PaaS, SaaS',answer:'**On-Premise:**\n- Eigene Hardware und Software im Unternehmen\n- Volle Kontrolle, hohe Investitionskosten (CAPEX)\n\n**IaaS (Infrastructure as a Service):**\n- Bereitstellung von: VMs, Netzwerk, Speicher\n- Kunde verwaltet: OS, Middleware, Anwendungen\n- Beispiele: AWS EC2, Microsoft Azure VMs, Google Compute Engine\n\n**PaaS (Platform as a Service):**\n- Bereitstellung von: Entwicklungsplattform, Datenbank, Runtime\n- Kunde verwaltet: Anwendungen und Daten\n- Beispiele: Azure App Service, Google App Engine, Heroku\n\n**SaaS (Software as a Service):**\n- Komplette Anwendung als Dienst\n- Kunde verwaltet: nur eigene Daten\n- Beispiele: Microsoft 365, Salesforce, Google Workspace\n\n**Verantwortung (Shared Responsibility Model):**\nCloud-Anbieter: Infrastruktur, Physische Sicherheit\nKunde: Daten, Identitäten, Konfiguration\n\n**Kostenmodell:** OPEX statt CAPEX → Pay-per-Use'},
    {keywords:['virtualisierung','hypervisor','typ 1','typ 2','vm','container','docker'],title:'Virtualisierung: Hypervisor Typ 1/2, VMs, Docker',answer:'**Virtualisierung:**\n- Eine physische Maschine → mehrere virtuelle Maschinen (VMs)\n- Bessere Ressourcennutzung, einfache Verwaltung\n\n**Hypervisor Typ 1 (Bare-Metal):**\n- Läuft direkt auf Hardware (kein Host-OS)\n- Bessere Performance und Sicherheit\n- Beispiele: VMware ESXi, Microsoft Hyper-V, Citrix XenServer\n\n**Hypervisor Typ 2 (Hosted):**\n- Läuft auf einem Host-Betriebssystem\n- Einfachere Installation, weniger Performance\n- Beispiele: VMware Workstation, VirtualBox, Parallels\n\n**Container (Docker):**\n- Teilen den OS-Kernel des Hosts\n- Leichter als VMs, schnellerer Start\n- Isoliert: Prozesse, Netzwerk, Dateisystem\n- **Image:** unveränderliche Vorlage\n- **Container:** laufende Instanz eines Images\n- Orchestrierung: **Kubernetes** (k8s)\n\n**VM vs. Container:**\nVM = eigener Kernel, stark isoliert, langsamer Start\nContainer = gemeinsamer Kernel, leichtgewichtig, Sekunden-Start'},
    {keywords:['san','nas','iscsi','nfs','smb','speichernetz','storage'],title:'SAN vs. NAS – Unterschiede & Protokolle',answer:'**NAS (Network Attached Storage):**\n- Dateibasierter Speicher über Netzwerk\n- Zugriff auf Dateiebene (Files)\n- Protokolle: **SMB/CIFS** (Windows), **NFS** (Linux/Unix)\n- Einfach zu verwalten, günstig\n- Einsatz: Dateiserver, Backups, Home Directories\n\n**SAN (Storage Area Network):**\n- Blockbasierter Speicher über dediziertes Netz\n- Zugriff auf Blockebene (wie lokale Festplatte)\n- Protokolle: **Fibre Channel (FC)**, **iSCSI** (TCP/IP), FCoE\n- Höhere Performance, teurer, komplexer\n- Einsatz: Datenbanken, virtuelle Maschinen, hochkritische Anwendungen\n\n**iSCSI:**\n- SCSI-Befehle über TCP/IP\n- Günstiger als Fibre Channel\n- Target = Speichergerät, Initiator = Server\n\n**SMB (Server Message Block):**\n- Windows-Dateifreigabe, Netzwerklaufwerke\n- Port 445\n\n**NFS (Network File System):**\n- Unix/Linux-Dateifreigabe\n- Port 2049\n\n**Zusammenfassung:** NAS = Dateien im Netz, SAN = Block-Speicher im eigenen Netz'},
    {keywords:['pki','ssl','tls','zertifikat','zertifizierungsstelle','ca','https','verschlüsselung'],title:'PKI, SSL/TLS & Zertifikate',answer:'**PKI (Public Key Infrastructure):**\n- System zur Verwaltung digitaler Zertifikate\n- Basis: asymmetrische Kryptografie (öffentlicher + privater Schlüssel)\n\n**Zertifikat (X.509):**\n- Enthält: öffentlichen Schlüssel, Inhaber, Aussteller, Gültigkeit\n- Signiert von einer **CA (Certificate Authority)**\n- CA = vertrauenswürdige dritte Instanz\n\n**Zertifikatskette:**\nRoot CA → Intermediate CA → End-Zertifikat\n\n**SSL/TLS (Transport Layer Security):**\n- Verschlüsselte Verbindung (HTTPS = HTTP über TLS)\n- Port: **443** (HTTPS)\n- Handshake:\n  1. Client sendet Hello (unterstützte Cipher Suites)\n  2. Server sendet Zertifikat\n  3. Schlüsselaustausch (ECDHE)\n  4. Verschlüsselte Verbindung aktiv\n\n**TLS 1.2 vs 1.3:**\n- TLS 1.3: schneller (0-RTT), sicherer, keine schwachen Algorithmen\n\n**Zertifikatstypen:**\n- **DV (Domain Validated):** nur Domain geprüft\n- **OV (Organization Validated):** Firma geprüft\n- **EV (Extended Validation):** strengste Prüfung, grünes Schloss\n\n**Selbstsigniert:** Kein CA, nur intern sinnvoll (z.B. Testumgebung)'},
    {keywords:['subnetting vlsm','vlsm beispiel','variable subnetzmaske','subnetz berechnen beispiel'],title:'Subnetting mit VLSM-Beispiel',answer:'**VLSM (Variable Length Subnet Masking):**\nVerschiedene Subnetzmasken je nach tatsächlichem Bedarf.\n\n**Vorgehensweise:**\n1. Anforderungen nach Größe sortieren (größtes Netz zuerst)\n2. Passendes Subnetz zuweisen\n3. Nächstes Subnetz beginnt hinter dem Broadcast des vorherigen\n\n**Beispiel: 192.168.10.0/24 aufteilen für:**\n- Abteilung A: 50 Hosts → /26 (62 Hosts)\n- Abteilung B: 25 Hosts → /27 (30 Hosts)\n- Abteilung C: 10 Hosts → /28 (14 Hosts)\n\n**Abteilung A (50 Hosts):**\n- Netz: 192.168.10.0/26\n- Hosts: .1 – .62\n- Broadcast: .63\n\n**Abteilung B (25 Hosts):**\n- Netz: 192.168.10.64/27\n- Hosts: .65 – .94\n- Broadcast: .95\n\n**Abteilung C (10 Hosts):**\n- Netz: 192.168.10.96/28\n- Hosts: .97 – .110\n- Broadcast: .111\n\n**Formel Hosts:** 2^(32-Präfix) - 2\n**Merke:** Immer 2 Adressen abziehen: Netzadresse und Broadcast!'},
    {keywords:['osi protokolle','osi schichten protokolle','schicht 2 protokoll','schicht 4 protokoll'],title:'OSI-Modell mit Protokollen je Schicht',answer:'**OSI-Schichten mit Protokollen:**\n\n**Schicht 7 – Anwendung:**\nHTTP, HTTPS, FTP, SMTP, POP3, IMAP, DNS, SNMP, SSH, Telnet\n\n**Schicht 6 – Darstellung:**\nSSL/TLS (teilweise), JPEG, MPEG, ASCII, Verschlüsselung\n\n**Schicht 5 – Sitzung:**\nNetBIOS, RPC, SQL (Sitzungsmanagement)\n\n**Schicht 4 – Transport:**\n**TCP** (verbindungsorientiert, Ports), **UDP** (verbindungslos)\nPorts: HTTP=80, HTTPS=443, FTP=21, SSH=22, SMTP=25, DNS=53\n\n**Schicht 3 – Vermittlung:**\n**IP** (IPv4, IPv6), **ICMP** (Ping), OSPF, BGP, ARP (grenzwertig)\n\n**Schicht 2 – Sicherung:**\n**Ethernet** (802.3), **WLAN** (802.11), PPP, HDLC, VLANs (802.1Q)\nMAC-Adressen, Frames, Switches\n\n**Schicht 1 – Bitübertragung:**\nEthernet-Kabel (Cat5e/6/7), Glasfaser, WLAN-Funk, DSL\nHubs, Repeater, Kabel\n\n**Merksatz:** _"Alle Deutschen Studenten Trinken Verschiedene Sorten Bier"_ (7→1)'}

// MATCH ENGINE
// ════════════════════════════════════════════════════════════════
function levenshtein(a, b) {
  var m = a.length, n = b.length, dp = [];
  for (var i = 0; i <= m; i++) { dp[i] = [i]; }
  for (var j = 0; j <= n; j++) { dp[0][j] = j; }
  for (var i = 1; i <= m; i++) {
    for (var j = 1; j <= n; j++) {
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}

function kiMatch(query) {
  var q = query.toLowerCase().trim();
  var words = q.split(/\s+/);
  var kb = KB[APP_ID] || KB.ampere;
  var best = null, bestScore = 0;

  kb.forEach(function(entry) {
    var score = 0;
    entry.keywords.forEach(function(kw) {
      if (q.includes(kw)) score += 10;
      else {
        words.forEach(function(w) {
          if (w.length < 3) return;
          if (kw.includes(w)) score += 5;
          else {
            var lev = levenshtein(w, kw.split(' ')[0] || kw);
            if (lev <= 2) score += 3;
          }
        });
      }
    });
    if (score > bestScore) { bestScore = score; best = entry; }
  });

  return bestScore >= 3 ? best : null;
}

// RENDER
// ════════════════════════════════════════════════════════════════
function renderAnswer(text) {
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/_(.+?)_/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br>');
}

function addMessage(html, role, isHtml) {
  var msgsEl = document.getElementById('chat-msgs');
  var div = document.createElement('div');
  div.className = 'msg ' + role;
  if (isHtml) div.innerHTML = html;
  else div.innerHTML = renderAnswer(html);
  msgsEl.appendChild(div);
  document.getElementById('scroll-anchor').scrollIntoView({behavior:'smooth', block:'end'});
}

var thinkCounter = 0;
function addThinking() {
  var id = 'think-' + (++thinkCounter);
  var msgsEl = document.getElementById('chat-msgs');
  var div = document.createElement('div');
  div.className = 'msg ai thinking'; div.id = id;
  div.textContent = '…';
  msgsEl.appendChild(div);
  document.getElementById('scroll-anchor').scrollIntoView({behavior:'smooth', block:'end'});
  return id;
}
function removeThinking(id) { var el = document.getElementById(id); if(el) el.remove(); }

function kiSend() {
  var input = document.getElementById('ki-input');
  var text = input.value.trim();
  if (!text) return;
  addMessage(text, 'user', false);
  input.value = '';
  document.getElementById('quick-area').style.display = 'none';
  var thinkId = addThinking();
  setTimeout(function() {
    removeThinking(thinkId);
    var result = kiMatch(text);
    if (result) {
      addMessage('<div class="app-badge" style="color:' + cfg.color + ';border-color:' + cfg.color + '33;background:' + cfg.color + '11;">' + cfg.icon + ' ' + cfg.label + '</div><br><strong>' + result.title + '</strong><br><br>' + renderAnswer(result.answer), 'ai', true);
    } else {
      addMessage('Zu "**' + text + '**" habe ich keinen passenden IHK-Eintrag.\n\nVersuche andere Begriffe — z.B. direkt den Fachbegriff eingeben.\n\nAlle Inhalte sind **offline** verfügbar.', 'ai');
    }
  }, Math.random() * 250 + 200);
}

function kiAsk(text) {
  document.getElementById('ki-input').value = text;
  kiSend();
}

document.getElementById('ki-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') kiSend();
});

// WEAKNESS PANEL
// ════════════════════════════════════════════════════════════════
function buildWeakPanel() {
  if (!cfg.perfKey) return;
  var data = {};
  try { data = JSON.parse(localStorage.getItem(cfg.perfKey) || '{}'); } catch(e) {}
  var topics = Object.keys(data);
  if (!topics.length) return;

  var weak = topics.filter(function(t) { return data[t].correct / data[t].total < 0.7; })
    .sort(function(a,b) { return data[a].correct/data[a].total - data[b].correct/data[b].total; });

  if (!weak.length) return;
  var panel = document.getElementById('weak-panel');
  var container = document.getElementById('weak-topics');
  panel.style.display = '';

  weak.forEach(function(t) {
    var d = data[t];
    var pct = Math.round(d.correct / d.total * 100);
    var btn = document.createElement('button');
    btn.className = 'weak-chip' + (pct >= 50 ? ' med' : '');
    btn.textContent = t + ' (' + pct + '%)';
    btn.onclick = function() { kiAsk(t + ' erklären'); };
    container.appendChild(btn);
  });
}
buildWeakPanel();
